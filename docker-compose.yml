services:
  # ============================================================================
  # INFERENCE LAYER: OLLAMA FOR LOCAL LLM COMPUTATION
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-backend
    restart: always
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4      # Optimizes memory bus concurrency for local APIs
      - OLLAMA_MAX_LOADED_MODELS=2 # Stabilizes VRAM footprint allocation boundaries
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all            # Maps the 4070 Ti Super tensor cores into the container
              capabilities: [gpu]

  # ============================================================================
  # INTERACTION LAYER: OPEN WEBUI USER INTERFACE (CHATGPT EXTENSION CLONE)
  # ============================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:8080"      # Restrict WebUI access to localhost unless you intentionally front it with HTTPS
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 # Direct backend internal container networking link
      - WEBUI_SECRET_KEY=cba_engineering_token # Protects secure database configuration states
    depends_on:
      - ollama

  # ============================================================================
  # METRICS EXPORTER: EXTRACTS BARE-METAL NVIDIA TELEMETRY
  # ============================================================================
  nvidia-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: telemetry-nvidia-exporter
    restart: always
    environment:
      - DCGM_EXPORTER_INTERVAL=1000          # Scrapes the GPU every 1 second
    expose:
      - "9400"                              # Keep Nvidia metrics internal to Docker; Prometheus can reach it via the service name
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================================
  # DATA METRICS RETENTION: PROMETHEUS TIME-SERIES ENGINE
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: telemetry-prometheus
    restart: always
    volumes:
      - /home/giblet/holly-core/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"

  # ============================================================================
  # VISUAL DASHBOARD MATRIX: GRAFANA FRONTEND PORTAL
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: telemetry-grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"               # Keep Grafana localhost-only unless you intentionally expose it externally
    volumes:
      - grafana-data:/var/lib/grafana        # Keeps dashboard layouts secure across boots

  # ============================================================================
  # FOCALBOARD: LIGHTWEIGHT KANBAN MANAGEMENT
  # ============================================================================
#  focalboard:
#    image: mattermost/focalboard:latest
#    container_name: focalboard
#    restart: always
#    ports:
#      - "8020:8000" # Exposes Focalboard on port 8020 so it avoids clashing with Open WebUI ports
#    volumes:
#      - ./focalboard_data:/opt/focalboard/data # Stores your cards and board configuration in a local SQLite file
#    environment:
#      - FOCALBOARD_PORT=8000

volumes:
  ollama_data:
  open-webui_data:
  prometheus-data:
  grafana-data:
#  focalboard_data:

