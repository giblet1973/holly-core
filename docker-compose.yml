services:
  # ============================================================================
  # INFERENCE LAYER: OLLAMA FOR LOCAL LLM COMPUTATION
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-backend
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4      # Optimizes memory bus concurrency for local APIs
      - OLLAMA_MAX_LOADED_MODELS=2 # Stabilizes VRAM footprint allocation boundaries
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all            # Maps the 4070 Ti Super tensor cores into the container
              capabilities: [gpu]

  # ============================================================================
  # INTERACTION LAYER: OPEN WEBUI USER INTERFACE (CHATGPT EXTENSION CLONE)
  # ============================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-frontend
    restart: always
    ports:
      - "3000:8080"                # Exposes the user interface on port 3000 of your local LAN
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 # Direct backend internal container networking link
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY} # Protects secure database configuration states
    depends_on:
      - ollama

  # ============================================================================
  # METRICS EXPORTER: EXTRACTS BARE-METAL NVIDIA TELEMETRY
  # ============================================================================
  nvidia-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: telemetry-nvidia-exporter
    restart: always
    environment:
      - DCGM_EXPORTER_INTERVAL=1000          # Scrapes the GPU every 1 second
    expose:
      - "9400"                                # Exposes the port internally within the Docker network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================================
  # DATA METRICS RETENTION: PROMETHEUS TIME-SERIES ENGINE
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: telemetry-prometheus
    restart: always
    volumes:
      - /home/giblet/holly-core/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - "9090"                                # Exposes the port internally within the Docker network
  # ============================================================================
  # VISUAL DASHBOARD MATRIX: GRAFANA FRONTEND PORTAL
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: telemetry-grafana
    restart: always
    ports:
      - "3001:3000"                          # Maps Grafana to port 3001 (leaves 3000 clear for WebUI)
    volumes:
      - grafana-data:/var/lib/grafana        # Keeps dashboard layouts secure across boots

  # ============================================================================
  # FOCALBOARD: LIGHTWEIGHT KANBAN MANAGEMENT
  # ============================================================================
  focalboard:
    image: mattermost/focalboard:7.11.4      # Frozen stable production release tag
    container_name: focalboard
    restart: always
    ports:
      - "8000:8000"                          # Exposes the Trello workspace on port 8000
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - focalboard_data:/opt/focalboard/data

volumes:
  ollama_data:
  open-webui_data:
  prometheus-data:
  grafana-data:
  focalboard_data:

